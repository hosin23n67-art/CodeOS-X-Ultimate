name: Build CodeOS X Ultimate ISO

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-iso.yml"
      - "security-center/**"
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium
          df -h

      - name: Prepare output directory
        run: mkdir -p "$GITHUB_WORKSPACE/output"

      - name: Build CodeOS X Ultimate ISO using Kali's supported live-build workflow
        run: |
          cat > "$RUNNER_TEMP/build-inside.sh" <<'CONTAINER_SCRIPT'
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          echo "== Updating Kali container packages =="
          apt-get update
          apt-get install -y --no-install-recommends git live-build cdebootstrap debootstrap curl xorriso ca-certificates
          git clone --depth 1 https://gitlab.com/kalilinux/build-scripts/kali-live.git
          cd kali-live

          # Keep package signature verification enabled; correct the obsolete keyring path if present.
          for search_root in . /usr/share/live-build; do
            if [ -d "$search_root" ]; then
              grep -RIl --exclude-dir=.git --exclude='*.po' --exclude='*.mo' 'chroot/etc/apt/trusted.gpg.d/kali-archive-keyring.gpg' "$search_root" 2>/dev/null || true
            fi
          done | sort -u | while IFS= read -r script; do
            [ -n "$script" ] || continue
            sed -i 's#chroot/etc/apt/trusted.gpg.d/kali-archive-keyring.gpg#chroot/usr/share/keyrings/kali-archive-keyring.gpg#g' "$script"
          done

          mkdir -p config/package-lists
          cat > config/package-lists/codeos.list.chroot <<'PACKAGES'
          kali-desktop-xfce
          kali-themes
          kali-menu
          lightdm
          thunar
          xfce4-whiskermenu-plugin
          papirus-icon-theme
          network-manager-applet
          nm-connection-editor
          firefox-esr
          python3
          python3-pip
          python3-venv
          python3-dev
          build-essential
          gcc
          g++
          clang
          lld
          llvm
          git
          cmake
          ninja-build
          make
          pkg-config
          nasm
          binutils
          curl
          wget
          vim
          neovim
          htop
          tmux
          tree
          unzip
          zip
          net-tools
          dnsutils
          iproute2
          openssh-client
          nmap
          wireshark
          sqlmap
          gobuster
          nikto
          john
          aircrack-ng
          hydra
          tcpdump
          PACKAGES
          test -s config/package-lists/codeos.list.chroot
          echo "== Package list prepared: $(wc -l < config/package-lists/codeos.list.chroot) packages =="
          ./build.sh

          iso="$(find images -maxdepth 1 -type f -name '*.iso' -print -quit)"
          if [ -z "$iso" ]; then
            echo "ERROR: build.sh finished without producing an ISO in images/." >&2
            find . -maxdepth 3 -type f | tail -100
            exit 1
          fi
          cp "$iso" /output/CodeOS-X-Ultimate-amd64.iso
          test -s /output/CodeOS-X-Ultimate-amd64.iso
          ls -lh /output/CodeOS-X-Ultimate-amd64.iso
          sha256sum /output/CodeOS-X-Ultimate-amd64.iso
          CONTAINER_SCRIPT

          echo "== Checking build script syntax =="
          bash -n "$RUNNER_TEMP/build-inside.sh"
          echo "== Running build inside Kali container =="
          docker run --privileged --rm --entrypoint /bin/bash \
            -v "$GITHUB_WORKSPACE/output:/output" \
            -v "$RUNNER_TEMP/build-inside.sh:/tmp/build-inside.sh:ro" \
            kalilinux/kali-rolling:latest /tmp/build-inside.sh
          
      - name: Verify ISO output
        run: |
          set -euo pipefail
          test -s output/CodeOS-X-Ultimate-amd64.iso
          size="$(stat -c '%s' output/CodeOS-X-Ultimate-amd64.iso)"
          echo "ISO size: $size bytes"
          if [ "$size" -lt 1000000000 ]; then
            echo "ERROR: ISO is unexpectedly small; refusing to publish it." >&2
            exit 1
          fi
          file output/CodeOS-X-Ultimate-amd64.iso
          sha256sum output/CodeOS-X-Ultimate-amd64.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeOS-X-Ultimate-amd64-ISO
          path: output/CodeOS-X-Ultimate-amd64.iso
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
