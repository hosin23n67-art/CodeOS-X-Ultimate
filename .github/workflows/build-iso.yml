name: Build CodeOS X Ultimate ISO

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-iso.yml"
      - "security-center/**"
      - "codeos-ui/**"
      - "README.md"

concurrency:
  group: codeos-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Check out CodeOS X project files
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium
          df -h

      - name: Prepare output directory
        run: mkdir -p "$GITHUB_WORKSPACE/output"

      - name: Build CodeOS X Ultimate ISO using Kali's supported live-build workflow
        run: |
          cat > "$RUNNER_TEMP/build-inside.sh" <<'CONTAINER_SCRIPT'
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          echo "== Updating Kali container packages =="
          apt-get update
          apt-get install -y --no-install-recommends git live-build cdebootstrap debootstrap curl xorriso ca-certificates

          # Kali live-build's installer helper still expects the archive keyring
          # in the legacy /etc/apt/trusted.gpg.d location inside the target chroot.
          # On current Kali, the package places it under /usr/share/keyrings.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/usr/lib/live/build/installer_debian-installer")
          s = p.read_text()
          target = "cp chroot/etc/apt/trusted.gpg.d/kali-archive-keyring.gpg"
          if target not in s:
              raise SystemExit("ERROR: expected legacy keyring copy command was not found in installer_debian-installer")
          block = """if [ ! -s chroot/etc/apt/trusted.gpg.d/kali-archive-keyring.gpg ]; then
              if [ -s chroot/usr/share/keyrings/kali-archive-keyring.gpg ]; then
                  install -D -m 0644 chroot/usr/share/keyrings/kali-archive-keyring.gpg chroot/etc/apt/trusted.gpg.d/kali-archive-keyring.gpg
              else
                  echo "ERROR: Kali keyring is missing from both legacy and current locations in chroot" >&2
                  exit 1
              fi
          fi
          """
          p.write_text(s.replace(target, block + target, 1))
          print("Patched installer_debian-installer with a current-keyring fallback.")
          PY
          git clone --depth 1 https://gitlab.com/kalilinux/build-scripts/kali-live.git
          cd kali-live

          # Compatibility shim for the legacy path used by older live-build helpers.
          # Keep signature verification enabled; use Kali's official keyring.
          if [ ! -s /usr/share/keyrings/kali-archive-keyring.gpg ]; then
            echo "ERROR: Kali archive keyring is missing in the build container." >&2
            exit 1
          fi
          # This helper reads the keyring during installer preparation, before
          # the normal includes.chroot files are copied into the final image.
          # Seed it before package installation as well as in the final image.
          install -D -m 0644 /usr/share/keyrings/kali-archive-keyring.gpg \
            config/includes.chroot_before_packages/etc/apt/trusted.gpg.d/kali-archive-keyring.gpg
          install -D -m 0644 /usr/share/keyrings/kali-archive-keyring.gpg \
            config/includes.chroot/etc/apt/trusted.gpg.d/kali-archive-keyring.gpg

          # Install CodeOS apps, launchers and artwork into the live image.
          DESTDIR="$PWD/config/includes.chroot" bash /project/codeos-ui/install-codeos-ui.sh

          mkdir -p config/package-lists
          cat > config/package-lists/codeos.list.chroot <<'PACKAGES'
          kali-desktop-xfce
          kali-themes
          kali-menu
          lightdm
          thunar
          xfce4-whiskermenu-plugin
          papirus-icon-theme
          network-manager-applet
          xfce4-settings
          xfce4-panel
          xfdesktop4
          xfce4-terminal
          xfconf
          adwaita-icon-theme
          papirus-icon-theme
          python3-tk
          policykit-1
          polkit-gnome
          pkexec
          calamares
          calamares-settings-kali
          gparted
          nm-connection-editor
          firefox-esr
          python3
          python3-pip
          python3-venv
          python3-dev
          build-essential
          gcc
          g++
          clang
          lld
          llvm
          git
          cmake
          ninja-build
          make
          pkg-config
          nasm
          binutils
          curl
          wget
          vim
          neovim
          htop
          tmux
          tree
          unzip
          zip
          net-tools
          dnsutils
          iproute2
          openssh-client
          nmap
          wireshark
          sqlmap
          gobuster
          nikto
          john
          aircrack-ng
          hydra
          tcpdump
          PACKAGES
          test -s config/package-lists/codeos.list.chroot
          echo "== Package list prepared: $(wc -l < config/package-lists/codeos.list.chroot) packages =="
          ./build.sh

          iso="$(find images -maxdepth 1 -type f -name '*.iso' -print -quit)"
          if [ -z "$iso" ]; then
            echo "ERROR: build.sh finished without producing an ISO in images/." >&2
            find . -maxdepth 3 -type f | tail -100
            exit 1
          fi
          cp "$iso" /output/CodeOS-X-Ultimate-amd64.iso
          test -s /output/CodeOS-X-Ultimate-amd64.iso
          ls -lh /output/CodeOS-X-Ultimate-amd64.iso
          sha256sum /output/CodeOS-X-Ultimate-amd64.iso
          CONTAINER_SCRIPT

          echo "== Checking build script syntax =="
          bash -n "$RUNNER_TEMP/build-inside.sh"
          echo "== Running build inside Kali container =="
          docker run --privileged --rm --entrypoint /bin/bash \
            -v "$GITHUB_WORKSPACE/output:/output" \
          -v "$GITHUB_WORKSPACE:/project:ro" \
            -v "$RUNNER_TEMP/build-inside.sh:/tmp/build-inside.sh:ro" \
            kalilinux/kali-rolling:latest /tmp/build-inside.sh
          
      - name: Verify ISO output
        run: |
          set -euo pipefail
          test -s output/CodeOS-X-Ultimate-amd64.iso
          size="$(stat -c '%s' output/CodeOS-X-Ultimate-amd64.iso)"
          echo "ISO size: $size bytes"
          if [ "$size" -lt 1000000000 ]; then
            echo "ERROR: ISO is unexpectedly small; refusing to publish it." >&2
            exit 1
          fi
          file output/CodeOS-X-Ultimate-amd64.iso
          sha256sum output/CodeOS-X-Ultimate-amd64.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeOS-X-Ultimate-amd64-ISO
          path: output/CodeOS-X-Ultimate-amd64.iso
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
