name: Build CodeOS X Ultimate ISO

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-iso.yml"
      - "security-center/**"
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium
          df -h

      - name: Prepare output directory
        run: mkdir -p "$GITHUB_WORKSPACE/output"

      - name: Build CodeOS X Ultimate ISO using Kali's supported live-build workflow
        run: |
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE/output:/output" \
            kalilinux/kali-rolling:latest \
            bash -lc '
              set -Eeuo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends git live-build cdebootstrap debootstrap curl xorriso ca-certificates
              git clone --depth 1 https://gitlab.com/kalilinux/build-scripts/kali-live.git
              cd kali-live

              # Add a conservative, useful package set without relying on unsupported
              # build.sh flags or brittle edits to upstream keyring handling.
              mkdir -p config/package-lists
              printf "%s\n" \
                "kali-desktop-xfce" \
                "kali-themes" \
                "kali-menu" \
                "lightdm" \
                "thunar" \
                "xfce4-whiskermenu-plugin" \
                "papirus-icon-theme" \
                "network-manager-applet" \
                "nm-connection-editor" \
                "firefox-esr" \
                "python3" \
                "python3-pip" \
                "python3-venv" \
                "python3-dev" \
                "build-essential" \
                "gcc" "g++" "clang" "lld" "llvm" \
                "git" "cmake" "ninja-build" "make" "pkg-config" \
                "nasm" "binutils" "curl" "wget" "vim" "neovim" \
                "htop" "tmux" "tree" "unzip" "zip" \
                "net-tools" "dnsutils" "iproute2" "openssh-client" \
                "nmap" "wireshark" "sqlmap" "gobuster" "nikto" \
                "john" "aircrack-ng" "hydra" "tcpdump" \
                > config/package-lists/codeos.list.chroot

              test -s config/package-lists/codeos.list.chroot
              echo "Package list prepared:"
              cat config/package-lists/codeos.list.chroot

              # The current upstream wrapper no longer supports --verbose; use its default build mode.
              ./build.sh

              iso="$(find images -maxdepth 1 -type f -name "*.iso" -print -quit)"
              if [ -z "$iso" ]; then
                echo "ERROR: Kali build finished without producing an ISO in images/." >&2
                find . -maxdepth 3 -type f | tail -100
                exit 1
              fi
              cp "$iso" /output/CodeOS-X-Ultimate-amd64.iso
              test -s /output/CodeOS-X-Ultimate-amd64.iso
              ls -lh /output/CodeOS-X-Ultimate-amd64.iso
              sha256sum /output/CodeOS-X-Ultimate-amd64.iso
            '

      - name: Verify ISO output
        run: |
          set -euo pipefail
          test -s output/CodeOS-X-Ultimate-amd64.iso
          size="$(stat -c '%s' output/CodeOS-X-Ultimate-amd64.iso)"
          echo "ISO size: $size bytes"
          if [ "$size" -lt 1000000000 ]; then
            echo "ERROR: ISO is unexpectedly small; refusing to publish it." >&2
            exit 1
          fi
          file output/CodeOS-X-Ultimate-amd64.iso
          sha256sum output/CodeOS-X-Ultimate-amd64.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeOS-X-Ultimate-amd64-ISO
          path: output/CodeOS-X-Ultimate-amd64.iso
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
